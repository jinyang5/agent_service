# ch03 · 全套:MySQL(3307)+ Milvus Standalone(19530)
# 注意:mysql 容器名沿用 mewhelp-mysql,与 ch02 compose 同名冲突——起本 compose 前先停 ch02 的。
services:
  mysql:
    image: mysql:8
    container_name: mewhelp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mewhelp
    ports:
      - "3307:3306"   # 宿主机 3307 → 容器 3306;本机 MySQL97 占着 3306
    volumes:
      - mewhelp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: mewhelp-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - mewhelp-milvus-etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    # 2026-09 起 minio/minio 已从 Docker Hub 下架(404),quay.io/minio/minio 匿名拉取 401;
    # 改用 Bitnami legacy 镜像:内含同一上游版本(DEVELOPMENT.2024-05-28T17-19-04Z,
    # 即原 pin 的 RELEASE.2024-05-28T17-19-04Z),仍是 MinIO,只换打包方与数据目录约定。
    image: bitnamilegacy/minio:2024.5.28
    container_name: mewhelp-milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - mewhelp-milvus-minio:/bitnami/minio/data   # Bitnami 约定数据目录;启动方式用镜像默认 entrypoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.6.22
    container_name: mewhelp-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - mewhelp-milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

volumes:
  mewhelp-mysql-data:
    name: mewhelp-mysql-data     # 复用 ch02 的卷,数据不丢
  mewhelp-milvus-etcd:
  mewhelp-milvus-minio:
  mewhelp-milvus-data:
