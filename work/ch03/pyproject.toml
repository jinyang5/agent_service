[project]
name = "ch03"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncmy>=0.2.9",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "flagembedding>=1.4.2",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 会话级 async fixture(_test_engine)与测试须共用同一个 event loop,
# 否则引擎连接池在会话 loop 建好、测试在函数 loop 复用时跨 loop 报错。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
