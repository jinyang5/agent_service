<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵喵优选 · 智能客服</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #eceff3; height: 100vh; display: flex;
    justify-content: center; align-items: center;
  }
  .chat {
    width: 100%; max-width: 720px; height: 92vh; background: #fff;
    border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.12);
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 16px 20px; background: #4c6ef5; color: #fff;
    display: flex; align-items: center; gap: 12px;
  }
  header .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #4c6ef5;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header p { font-size: 12px; opacity: .85; margin-top: 2px; }
  header button {
    margin-left: auto; background: rgba(255,255,255,.2); color: #fff; border: 0;
    padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  header button:hover { background: rgba(255,255,255,.32); }
  #messages {
    flex: 1; overflow-y: auto; padding: 20px; display: flex;
    flex-direction: column; gap: 14px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 76%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px;
    line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  }
  .assistant .bubble { background: #f1f3f5; color: #212529; border-bottom-left-radius: 4px; }
  .user .bubble { background: #4c6ef5; color: #fff; border-bottom-right-radius: 4px; }
  .hint { text-align: center; color: #adb5bd; font-size: 12.5px; margin-top: 6px; }
  .cursor::after {
    content: "▍"; color: #4c6ef5; animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  footer { padding: 14px 16px; border-top: 1px solid #e9ecef; display: flex; gap: 10px; }
  #input {
    flex: 1; border: 1px solid #dee2e6; border-radius: 10px; padding: 11px 14px;
    font-size: 14.5px; font-family: inherit; resize: none; max-height: 120px; outline: none;
  }
  #input:focus { border-color: #4c6ef5; }
  #send {
    background: #4c6ef5; color: #fff; border: 0; border-radius: 10px;
    padding: 0 22px; font-size: 14.5px; cursor: pointer;
  }
  #send:disabled { background: #adb5bd; cursor: not-allowed; }
</style>
</head>
<body>
<div class="chat">
  <header>
    <div class="avatar">🐱</div>
    <div>
      <h1>喵喵优选 · 智能客服「小喵」</h1>
      <p>商品 / 订单 / 物流 / 售后,都可以问我</p>
    </div>
    <button id="new">新会话</button>
  </header>
  <div id="messages">
    <div class="hint">试试问:「你们卖猫粮吗?」然后追问「有便宜点的吗?」</div>
  </div>
  <footer>
    <textarea id="input" rows="1" placeholder="输入消息,回车发送…"></textarea>
    <button id="send">发送</button>
  </footer>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const newBtn = document.getElementById('new');

let sessionId = newId();

function newId() {
  return 'web-' + Math.random().toString(36).slice(2, 10);
}

function scrollDown() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addRow(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text || '';
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollDown();
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addRow('user', text);
  const bubble = addRow('assistant', '');
  bubble.classList.add('cursor');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) {
      bubble.textContent = '请求失败(HTTP ' + res.status + ')';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const blocks = buffer.split('\n\n');
      buffer = blocks.pop();

      for (const block of blocks) {
        if (block.includes('event: error')) {
          const m = block.match(/data: (.*)/);
          let msg = '上游模型暂时不可用';
          if (m) { try { msg = JSON.parse(m[1]).message || msg; } catch (e) {} }
          bubble.textContent = '⚠️ ' + msg;
          return;
        }
        const line = block.trim();
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') return;
        try {
          const { delta } = JSON.parse(data);
          if (delta) { bubble.textContent += delta; scrollDown(); }
        } catch (e) {}
      }
    }
  } catch (err) {
    bubble.textContent = '⚠️ 连接失败:' + err.message;
  } finally {
    bubble.classList.remove('cursor');
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

newBtn.addEventListener('click', () => {
  sessionId = newId();
  messagesEl.innerHTML = '<div class="hint">已开启新会话,聊点别的吧 ~</div>';
  inputEl.focus();
});

inputEl.focus();
</script>
</body>
</html>
